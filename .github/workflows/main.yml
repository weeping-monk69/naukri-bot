name: Naukri Auto Updater

on:
  schedule:
    # Option 1 (Active): Runs every 3 hours at :53 IST (5:53 AM, 8:53 AM, 11:53 AM, 2:53 PM, 5:53 PM, 8:53 PM, 11:53 PM, 2:53 AM)
   # - cron: '23 */3 * * *'
    
    # Option 2 (Safer Daytime-Only): Uncomment below and comment out Option 1 to run only at 8:53 AM, 11:53 AM, 2:53 PM, and 5:53 PM IST
     - cron: '23 3,6,9,12 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chrome --with-deps

      - name: Run Updater Script with Virtual Display
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python update_naukri.py

      - name: Upload Failure Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_failure.png
          if-no-files-found: ignore
          retention-days: 3
