name: Naukri Auto Updater

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chrome --with-deps

      - name: Run Updater Script with Virtual Display
        env:
          NAUKRI_COOKIES: ${{ secrets.NAUKRI_COOKIES }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" python update_naukri.py
